# Netlify: VISTAS PREVIAS POR PROPUESTA DE CAMBIO. Plan gratuito.
#
# YA NO ES EL SITIO DE PRODUCCION. Desde el 15 de agosto de 2026 la aplicacion
# publicada vive en CloudFront, sobre apoyo-colombia.com, y la levanta
# entorno/aws/desplegar-front.sh. Este archivo se conserva por una sola razon, y
# es la que el ADR 004 llama importante:
#
#   "La vista previa por PR es solo de la PWA. Un entorno completo por PR es caro
#    y no hace falta. Pero la vista previa del frontend si, y no por los devs: es
#    lo que permite que alguien de F6 abra un enlace en su Android y pruebe el
#    cambio antes del merge."
#
# F6 —probar en un telefono real, en campo— es el frente mas urgente del proyecto
# y el unico que no necesita programar. Un enlace que se abre en el celular sin
# instalar nada es lo que lo hace accionable, y eso CloudFront no lo da.
#
# SI ESTE SITIO ESTA CONECTADO A main, DESCONECTELO. Publicar main aqui crearia un
# segundo sitio de produccion, servido desde otro dominio y envejeciendo por su
# cuenta. Solo deben publicarse las vistas previas de propuestas de cambio.
#
# Lo que una vista previa NO puede hacer: iniciar sesion. La API solo acepta
# peticiones desde apoyo-colombia.com, www y localhost, asi que un dominio de
# vista previa recibe un rechazo de CORS. Es correcto y no hay que "arreglarlo":
# lo que se prueba aqui es la captura sin conexion, que es justo lo de F6.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22.14.0"

# Angular es una SPA: cualquier ruta debe servir index.html y dejar que el router
# resuelva. Sin esto, recargar en /casos devuelve 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker debe poder actualizarse. Si la CDN cachea ngsw.json, el
# dispositivo se queda con una version vieja de la aplicacion y no hay forma de
# corregir un error en campo sin que el voluntario desinstale.
[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Los bundles llevan hash en el nombre: se pueden cachear indefinidamente.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Endurecimiento basico. La aplicacion maneja datos personales de poblacion
# vulnerable y va a ser accesible desde una URL publica.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=()"

    # Politica de seguridad de contenido. HU 1.6.2: la documentacion decia
    # "endurecimiento de cabeceras" y esta era justamente la que faltaba, que es la
    # que impide que un script de otro origen lea los casos guardados en el
    # dispositivo.
    #
    # style-src admite estilos en linea porque las pantallas los usan hoy. Es la
    # concesion consciente de esta politica y se cierra el dia que esos estilos se
    # muevan a la hoja de estilos.
    #
    # connect-src decia `https:` porque la direccion de la API no estaba decidida.
    # Ya lo esta. Con `https:` la politica evitaba el robo por script inyectado;
    # con el origen fijo evita ademas que ese script MANDE los casos a un servidor
    # ajeno, que es la mitad que faltaba.
    #
    # La misma politica esta en la distribucion de CloudFront
    # (entorno/aws/desplegar-front.sh). Si se cambia una, hay que cambiar la otra:
    # son dos sitios porque son dos servidores, no porque sean dos decisiones.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.apoyo-colombia.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

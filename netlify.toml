# Despliegue de Raiz en Netlify. Plan gratuito.
# Conectar el repositorio una sola vez; a partir de ahi cada push a main publica.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22.14.0"

# Angular es una SPA: cualquier ruta debe servir index.html y dejar que el router
# resuelva. Sin esto, recargar en /casos devuelve 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker debe poder actualizarse. Si la CDN cachea ngsw.json, el
# dispositivo se queda con una version vieja de la aplicacion y no hay forma de
# corregir un error en campo sin que el voluntario desinstale.
[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Los bundles llevan hash en el nombre: se pueden cachear indefinidamente.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Endurecimiento basico. La aplicacion maneja datos personales de poblacion
# vulnerable y va a ser accesible desde una URL publica.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=()"

    # Politica de seguridad de contenido. HU 1.6.2: la documentacion decia
    # "endurecimiento de cabeceras" y esta era justamente la que faltaba, que es la
    # que impide que un script de otro origen lea los casos guardados en el
    # dispositivo.
    #
    # style-src admite estilos en linea porque las pantallas los usan hoy. Es la
    # concesion consciente de esta politica y se cierra el dia que esos estilos se
    # muevan a la hoja de estilos.
    #
    # connect-src deja https porque la direccion de la API todavia no esta decidida.
    # Cuando lo este, se reemplaza por ese origen y nada mas: hoy la cabecera evita
    # el robo por script inyectado, y con el origen fijo evitaria ademas el envio a
    # un servidor ajeno.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

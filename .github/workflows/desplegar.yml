# =============================================================================
# Despliegue a produccion. HU 1.1.2.
#
# SIN NINGUN SECRETO DE AWS. Ni aqui ni en la configuracion del repositorio.
#
# GitHub firma un token que dice "soy la rama main de este repositorio"; AWS lo
# verifica contra las llaves publicas de GitHub y entrega credenciales que duran
# una hora. No hay llave que guardar, que rotar ni que perder. Si alguien agrega
# un AWS_ACCESS_KEY_ID a los secretos del repositorio, esta deshaciendo esto.
#
# El rol y la confianza los crea entorno/aws/desplegar-identidad-federada.sh, y la
# confianza esta acotada a `refs/heads/main`: una propuesta de cambio no puede
# asumirlo por mucho que altere este archivo.
#
# -----------------------------------------------------------------------------
# SE DISPARA AL FUSIONAR, Y ESPERA UNA APROBACION
# -----------------------------------------------------------------------------
#
# Hasta el 21 de agosto esto solo se disparaba a mano, con este argumento: el ADR
# 004 pide aprobacion humana antes de produccion, no hay preproduccion, luego el
# boton manual ES esa aprobacion.
#
# El argumento era correcto y la consecuencia no. En la practica «a mano» quiso
# decir «cuando la unica persona con el contexto pueda»: construir la imagen,
# subirla, correr migraciones y publicar el frontend, a las ocho de la manana,
# entre la escuela de los ninos y otra reunion. Una secuencia manual hecha por una
# persona cansada es mas peligrosa que la automatizacion que se queria evitar, y
# ademas convierte a esa persona en un punto unico de fallo del proyecto entero.
#
# Lo que se hace ahora es separar las dos cosas que estaban pegadas:
#
#   EJECUTAR  lo hace el flujo, siempre igual, en el mismo orden, sin olvidos.
#   APROBAR   lo hace una persona, desde el telefono, en diez segundos.
#
# La aprobacion vive en el entorno `produccion` de GitHub, con revisores
# requeridos. Al fusionar a main el despliegue QUEDA EN ESPERA y no toca nada
# hasta que alguien lo aprueba. Es la misma puerta humana del ADR, sostenida por
# cualquiera de la mesa y no por una sola persona.
#
# SI EL ENTORNO NO TIENE REVISORES CONFIGURADOS, esto despliega solo. Es la unica
# forma de equivocarse aqui y esta escrita a proposito: configurar los revisores en
# Ajustes > Environments > produccion es parte de poner esto en marcha, no un
# detalle posterior.
#
# -----------------------------------------------------------------------------
# ESTE ARCHIVO NO IMPLEMENTA EL DESPLIEGUE: LLAMA A LOS GUIONES QUE YA EXISTEN
# -----------------------------------------------------------------------------
#
# Durante un dia este flujo tuvo los comandos escritos adentro, copiados de
# entorno/aws/. Eso dejaba la misma logica en dos sitios, y con ella la garantia de que
# un dia divergirian: el guion se cambia, el flujo no, y como el flujo es el que corre
# de verdad, el guion se convierte en documentacion que miente.
#
# Peor: cuando algo falla de noche, quien lo mire va a abrir una terminal y correr el
# guion. Si ese guion no es el que despliega, esta depurando otra cosa.
#
# Ahora los guiones son la unica implementacion y esto es una lista de pasos. La unica
# diferencia entre correrlos aqui y correrlos a mano son las credenciales, y de eso se
# encarga cuenta-correcta.sh.
#
# -----------------------------------------------------------------------------
# EL ORDEN NO ES NEGOCIABLE
# -----------------------------------------------------------------------------
#
#   1. subir la imagen
#   2. aplicar migraciones   <- ANTES de que la version nueva reciba trafico
#   3. actualizar el servicio
#
# Es el criterio de la HU 1.1.3. Al reves, la version nueva atenderia peticiones
# contra un esquema viejo. Y las migraciones son solo aditivas justamente para que
# la version ANTERIOR siga funcionando durante los segundos en que conviven.
# =============================================================================
name: Desplegar

on:
  push:
    branches: [main]
    # Un cambio que solo toca documentacion no reconstruye ni redespliega nada.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  # `id-token: write` es lo que permite pedirle a GitHub el token firmado. Es el
  # unico permiso elevado del flujo, y no da acceso a nada por si mismo: sin la
  # confianza declarada en AWS, ese token no vale nada.
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CUENTA: '303638556798'
  CLUSTER: raiz
  SERVICIO: raiz-api

jobs:
  desplegar:
    name: Publicar, migrar y desplegar
    runs-on: ubuntu-latest

    # La puerta humana. Con revisores configurados, el flujo espera aqui.
    environment: produccion

    steps:
      - uses: actions/checkout@v4

      - name: Credenciales por identidad federada
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::303638556798:role/raiz-despliegue-produccion
          aws-region: us-east-1
          # Sale en CloudTrail y es lo que permite saber que despliegue fue cual
          # sin cruzar horas a mano.
          role-session-name: gha-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # ARM64 porque es lo que corre en Fargate. El corredor de GitHub es x86, asi
      # que hace falta emulacion para construir esta arquitectura; sin esto la
      # imagen sale x86 y la tarea muere con "exec format error", que es el fallo
      # mas aburrido de todo este despliegue.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Cada paso es un guion de entorno/aws/, el mismo que se corre a mano. Las
      # credenciales llegan por el entorno y `cuenta-correcta.sh` las resuelve sin
      # perfil, ademas de comprobar que apuntan a la cuenta de Raiz y no a otra.
      #
      # RAIZ_COMMIT hace que la imagen quede etiquetada tambien con el sha, que es lo
      # que permite volver atras desplegando una anterior sin reconstruir.

      - name: Publicar las imagenes
        working-directory: entorno/aws
        env:
          RAIZ_COMMIT: ${{ github.sha }}
        run: ./publicar-api.sh

      - name: Aplicar migraciones
        working-directory: entorno/aws
        run: ./aplicar-migraciones.sh

      # Si las migraciones fallan, el guion sale distinto de cero, el flujo se corta y
      # el servicio se queda con la version que ya tenia, funcionando contra el esquema
      # que ya tenia. Es el resultado correcto: no desplegar es mejor que desplegar
      # contra una base a medio migrar.

      - name: Desplegar el servicio
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICIO"             --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICIO"

      - name: Comprobar que la API responde
        run: |
          # Contra el nombre publico y no contra la IP de la tarea: lo que importa es
          # que el camino completo funcione, incluidos el certificado y el balanceador.
          for i in 1 2 3 4 5; do
            CODIGO="$(curl -s -o /tmp/salud -w '%{http_code}' https://api.apoyo-colombia.com/salud || true)"
            if [ "$CODIGO" = "200" ]; then
              cat /tmp/salud
              exit 0
            fi
            sleep 10
          done
          echo "La API no respondio 200 en /salud despues del despliegue." >&2
          exit 1

      # LA PWA VA AL FINAL Y NO ANTES. Si la aplicacion llegara primero, los campos
      # nuevos que el servidor todavia no conoce se perderian en silencio: el envio
      # responde 200 y el dato no queda.
      #
      # El guion trae sus propias comprobaciones —que el paquete no apunte a localhost,
      # que la version coincida con la que responde la API, que la aplicacion abra al
      # terminar— y ahora protegen tambien a quien publique a mano.

      - name: Publicar la PWA
        working-directory: entorno/aws
        run: ./publicar-front.sh

# =============================================================================
# Despliegue a produccion. HU 1.1.2.
#
# SIN NINGUN SECRETO DE AWS. Ni aqui ni en la configuracion del repositorio.
#
# GitHub firma un token que dice "soy la rama main de este repositorio"; AWS lo
# verifica contra las llaves publicas de GitHub y entrega credenciales que duran
# una hora. No hay llave que guardar, que rotar ni que perder. Si alguien agrega
# un AWS_ACCESS_KEY_ID a los secretos del repositorio, esta deshaciendo esto.
#
# El rol y la confianza los crea entorno/aws/desplegar-identidad-federada.sh, y la
# confianza esta acotada a `refs/heads/main`: una propuesta de cambio no puede
# asumirlo por mucho que altere este archivo.
#
# -----------------------------------------------------------------------------
# SE DISPARA AL FUSIONAR, Y ESPERA UNA APROBACION
# -----------------------------------------------------------------------------
#
# Hasta el 21 de agosto esto solo se disparaba a mano, con este argumento: el ADR
# 004 pide aprobacion humana antes de produccion, no hay preproduccion, luego el
# boton manual ES esa aprobacion.
#
# El argumento era correcto y la consecuencia no. En la practica «a mano» quiso
# decir «cuando la unica persona con el contexto pueda»: construir la imagen,
# subirla, correr migraciones y publicar el frontend, a las ocho de la manana,
# entre la escuela de los ninos y otra reunion. Una secuencia manual hecha por una
# persona cansada es mas peligrosa que la automatizacion que se queria evitar, y
# ademas convierte a esa persona en un punto unico de fallo del proyecto entero.
#
# Lo que se hace ahora es separar las dos cosas que estaban pegadas:
#
#   EJECUTAR  lo hace el flujo, siempre igual, en el mismo orden, sin olvidos.
#   APROBAR   lo hace una persona, desde el telefono, en diez segundos.
#
# La aprobacion vive en el entorno `produccion` de GitHub, con revisores
# requeridos. Al fusionar a main el despliegue QUEDA EN ESPERA y no toca nada
# hasta que alguien lo aprueba. Es la misma puerta humana del ADR, sostenida por
# cualquiera de la mesa y no por una sola persona.
#
# SI EL ENTORNO NO TIENE REVISORES CONFIGURADOS, esto despliega solo. Es la unica
# forma de equivocarse aqui y esta escrita a proposito: configurar los revisores en
# Ajustes > Environments > produccion es parte de poner esto en marcha, no un
# detalle posterior.
#
# -----------------------------------------------------------------------------
# EL ORDEN NO ES NEGOCIABLE
# -----------------------------------------------------------------------------
#
#   1. subir la imagen
#   2. aplicar migraciones   <- ANTES de que la version nueva reciba trafico
#   3. actualizar el servicio
#
# Es el criterio de la HU 1.1.3. Al reves, la version nueva atenderia peticiones
# contra un esquema viejo. Y las migraciones son solo aditivas justamente para que
# la version ANTERIOR siga funcionando durante los segundos en que conviven.
# =============================================================================
name: Desplegar

on:
  push:
    branches: [main]
    # Un cambio que solo toca documentacion no reconstruye ni redespliega nada.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  # `id-token: write` es lo que permite pedirle a GitHub el token firmado. Es el
  # unico permiso elevado del flujo, y no da acceso a nada por si mismo: sin la
  # confianza declarada en AWS, ese token no vale nada.
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CUENTA: '303638556798'
  CLUSTER: raiz
  SERVICIO: raiz-api

jobs:
  desplegar:
    name: Publicar, migrar y desplegar
    runs-on: ubuntu-latest

    # La puerta humana. Con revisores configurados, el flujo espera aqui.
    environment: produccion

    steps:
      - uses: actions/checkout@v4

      - name: Credenciales por identidad federada
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::303638556798:role/raiz-despliegue-produccion
          aws-region: us-east-1
          # Sale en CloudTrail y es lo que permite saber que despliegue fue cual
          # sin cruzar horas a mano.
          role-session-name: gha-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # ARM64 porque es lo que corre en Fargate. El corredor de GitHub es x86, asi
      # que hace falta emulacion para construir esta arquitectura; sin esto la
      # imagen sale x86 y la tarea muere con "exec format error", que es el fallo
      # mas aburrido de todo este despliegue.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Publicar la imagen de la API
        run: |
          docker buildx build --platform linux/arm64 \
            -f api/Dockerfile \
            -t "$CUENTA.dkr.ecr.$AWS_REGION.amazonaws.com/raiz-api:latest" \
            -t "$CUENTA.dkr.ecr.$AWS_REGION.amazonaws.com/raiz-api:${{ github.sha }}" \
            --push .

      - name: Publicar la imagen de migraciones
        run: |
          docker buildx build --platform linux/arm64 \
            -f entorno/aws/migraciones/Dockerfile \
            -t "$CUENTA.dkr.ecr.$AWS_REGION.amazonaws.com/raiz-migraciones:latest" \
            --push .

      # Se etiqueta ademas con el sha del commit. `latest` dice que hay desplegado
      # ahora; la etiqueta con sha es lo que permite volver atras desplegando una
      # anterior, sin reconstruir. El ADR 004 pide exactamente eso.

      - name: Aplicar migraciones
        run: |
          REV="$(aws ecs describe-task-definition --task-definition raiz-migraciones \
                   --query 'taskDefinition.revision' --output text)"
          SUBRED="$(aws ec2 describe-subnets --filters Name=tag:Name,Values=raiz-publica-a \
                     --query 'Subnets[0].SubnetId' --output text)"
          SG="$(aws ec2 describe-security-groups --filters Name=group-name,Values=raiz-sg-api \
                 --query 'SecurityGroups[0].GroupId' --output text)"

          TAREA="$(aws ecs run-task --cluster "$CLUSTER" \
            --task-definition "raiz-migraciones:$REV" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBRED],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TAREA"

          ID="${TAREA##*/}"
          aws logs get-log-events --log-group-name /raiz/migraciones \
            --log-stream-name "ecs/migraciones/$ID" --start-from-head \
            --query 'events[].message' --output text | tr '\t' '\n'

          CODIGO="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TAREA" \
                     --query 'tasks[0].containers[0].exitCode' --output text)"
          if [ "$CODIGO" != "0" ]; then
            echo "Las migraciones fallaron. NO se despliega la version nueva." >&2
            exit 1
          fi

      # Si las migraciones fallan, el paso anterior corta el flujo y el servicio
      # se queda con la version que ya tenia, funcionando contra el esquema que ya
      # tenia. Es el resultado correcto: no desplegar es mejor que desplegar
      # contra una base a medio migrar.

      - name: Desplegar el servicio
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICIO" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICIO"

      - name: Comprobar que responde
        run: |
          # Se comprueba contra el nombre publico, no contra la IP de la tarea: lo
          # que importa es que el camino completo funcione, incluidos el
          # certificado y el balanceador.
          for i in 1 2 3 4 5; do
            CODIGO="$(curl -s -o /tmp/salud -w '%{http_code}' https://api.apoyo-colombia.com/salud || true)"
            if [ "$CODIGO" = "200" ]; then
              cat /tmp/salud
              exit 0
            fi
            sleep 10
          done
          echo "La API no respondio 200 en /salud despues del despliegue." >&2
          exit 1

      # -----------------------------------------------------------------------
      # LA PWA
      # -----------------------------------------------------------------------
      #
      # Esta es la parte que nunca estuvo automatizada, y la que obligaba a que
      # alguien abriera una terminal. El guion equivalente
      # —entorno/aws/publicar-front.sh— depende de `front.env`, un archivo que
      # genera el despliegue inicial y que vive en UNA maquina. Aqui el bucket y la
      # distribucion se descubren de AWS, igual que ya se descubren la subred y el
      # grupo de seguridad para las migraciones. Sin archivos locales, cualquiera
      # puede desplegar.
      #
      # VA DESPUES DE LA API Y NO ANTES. Si la aplicacion llegara primero, los
      # campos nuevos que el servidor todavia no conoce se perderian en silencio:
      # el envio responde 200 y el dato no queda. Es el peor fallo posible aqui,
      # porque nadie lo nota.

      - name: Compilar la PWA
        run: |
          npm ci
          npm run build --workspace @raiz/dominio
          npm run build --workspace frontend

      - name: Comprobar que el paquete apunta a la API
        run: |
          DIST=frontend/dist/frontend/browser
          test -f "$DIST/index.html" || { echo "No se genero el index." >&2; exit 1; }

          # Compilado en modo local, el paquete apunta a localhost y NO sincroniza
          # nunca. La aplicacion abre, deja capturar, y los casos se quedan en el
          # telefono. Es exactamente el fallo que no da error.
          if ! grep -rq "api.apoyo-colombia.com" "$DIST"; then
            echo "El paquete no contiene la direccion de la API: se compilo en modo local." >&2
            exit 1
          fi

      - name: Comprobar que la aplicacion y la API son la misma version
        run: |
          VERSION="$(node -p "require('./frontend/package.json').version")"
          SALUD="$(curl -s -m 20 https://api.apoyo-colombia.com/salud)"
          VERSION_API="$(printf '%s' "$SALUD" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version ?? ""')"

          # En este flujo coinciden por construccion —la API se acaba de desplegar
          # arriba— y justamente por eso la comprobacion vale: si NO coinciden, algo
          # que se creia cierto no lo es, y conviene enterarse aqui.
          if [ "$VERSION" != "$VERSION_API" ]; then
            echo "La aplicacion es la $VERSION y la API responde la $VERSION_API." >&2
            echo "Publicarla asi haria que los campos nuevos se pierdan en silencio." >&2
            exit 1
          fi
          echo "las dos son la $VERSION"

      - name: Publicar la PWA
        run: |
          DIST=frontend/dist/frontend/browser
          BUCKET="raiz-front-$CUENTA"
          VERSION="$(node -p "require('./frontend/package.json').version")"

          # PRIMERO LO QUE LLEVA HASH EN EL NOMBRE, DESPUES EL INDEX.
          # Al reves habria unos segundos con un index nuevo apuntando a paquetes
          # que todavia no existen, y quien abra la aplicacion en esa ventana recibe
          # una pagina rota. Son segundos y en campo casi nunca se notaria: «casi
          # nunca» es la clase de fallo que aparece el dia de la jornada.
          EXCLUIR="--exclude index.html --exclude ngsw.json --exclude ngsw-worker.js"
          EXCLUIR="$EXCLUIR --exclude safety-worker.js --exclude worker-basic.min.js"
          aws s3 sync "$DIST" "s3://$BUCKET/" $EXCLUIR --cache-control "public, max-age=31536000, immutable" --only-show-errors

          # Sellar el worker con la version es lo que hace que el navegador lo
          # reinstale. Sin esto, un telefono que ya tiene la aplicacion en cache
          # sigue con la anterior aunque el servidor ya sirva otra.
          echo "" >> "$DIST/ngsw-worker.js"
          echo "// Raiz $VERSION" >> "$DIST/ngsw-worker.js"

          for archivo in index.html ngsw.json ngsw-worker.js safety-worker.js worker-basic.min.js; do
            [ -f "$DIST/$archivo" ] || continue
            case "$archivo" in
              *.html) TIPO="text/html; charset=utf-8" ;;
              *.json) TIPO="application/json" ;;
              *.js)   TIPO="text/javascript; charset=utf-8" ;;
              *)      TIPO="application/octet-stream" ;;
            esac
            aws s3 cp "$DIST/$archivo" "s3://$BUCKET/$archivo" --cache-control "no-store, must-revalidate" --content-type "$TIPO" --only-show-errors
          done

      - name: Invalidar la cache y comprobar que la PWA responde
        run: |
          CONSULTA="DistributionList.Items[?Comment=='PWA de Raiz'] | [0].Id"
          DISTRIBUCION="$(aws cloudfront list-distributions --query "$CONSULTA" --output text)"

          if [ -z "$DISTRIBUCION" ] || [ "$DISTRIBUCION" = "None" ]; then
            echo "No se encontro la distribucion de CloudFront." >&2
            exit 1
          fi

          RUTAS="/index.html /ngsw.json /ngsw-worker.js"
          INV="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUCION" --paths $RUTAS --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUCION" --id "$INV"

          # Que el despliegue termine sin error no dice que la aplicacion abra. Esto
          # si lo dice.
          CODIGO="$(curl -s -o /dev/null -w '%{http_code}' https://apoyo-colombia.com/)"
          if [ "$CODIGO" != "200" ]; then
            echo "La PWA no respondio 200 despues de publicar (fue $CODIGO)." >&2
            exit 1
          fi
          echo "la aplicacion abre"

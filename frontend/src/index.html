<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8">
    <title>Raíz</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Caracterización y seguimiento de familias afectadas por el sismo. Funciona sin conexión.">
    <meta name="theme-color" content="#2b3a2e">
    <meta name="color-scheme" content="light">
    <!-- Permite instalarla desde Safari en iOS con el nombre correcto. -->
    <!-- El estandar es `mobile-web-app-capable`; el prefijo de Apple quedo obsoleto y
         el navegador lo advierte en consola. Se dejan los dos: iOS antiguo sigue
         leyendo solo el suyo, y en campo hay telefonos viejos. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Raíz">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      Para usar Raíz necesita habilitar JavaScript en el navegador.
    </noscript>
  </body>
</html>
